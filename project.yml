name: DisplayPilot

options:
  bundleIdPrefix: com.steve233
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "26.0"
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: NO
    SWIFT_STRICT_CONCURRENCY: minimal
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  DisplayPilot:
    type: application
    platform: macOS
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.steve233.DisplayPilot
        PRODUCT_NAME: DisplayPilot
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_CFBundleDisplayName: DisplayPilot
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_NSHumanReadableCopyright: "MIT licensed. Icons: GitHub Octicons (MIT)."
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: ""
        COMBINE_HIDPI_IMAGES: YES
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    dependencies:
      - sdk: IOKit.framework
      - sdk: ApplicationServices.framework
      - sdk: Carbon.framework
      - sdk: ColorSync.framework
      - sdk: ServiceManagement.framework

  DisplayPilotTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
    dependencies:
      - target: DisplayPilot
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.steve233.DisplayPilotTests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  DisplayPilot:
    build:
      targets:
        DisplayPilot: all
        DisplayPilotTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - DisplayPilotTests
    archive:
      config: Release
